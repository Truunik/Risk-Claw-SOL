[toolchain]
package_manager = "yarn"
anchor_version = "0.32.1"  # arcium-anchor 0.9.7 pins anchor-lang 0.32.1; align CLI to silence the build warning

[features]
resolution = true
skip-lint = false

[programs.localnet]
# Reference host program removed; real host lives in /programs/programs/risk_policy
# and gets its program id assigned via `anchor keys sync` in that workspace.

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test"

[hooks]
